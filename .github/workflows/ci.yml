name: SceneSeek CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt -r apps/worker/requirements.txt
      - run: pytest -q
      - run: python -m compileall -q apps/api/app apps/api/core apps/worker/worker tools
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pip install pip-audit && pip-audit -r apps/worker/requirements.txt
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/web
        run: npm install --no-audit --no-fund
      - working-directory: apps/web
        run: npm audit --audit-level=high
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run build
