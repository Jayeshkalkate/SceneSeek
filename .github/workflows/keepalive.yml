# Optional manual smoke-check only. It deliberately does not ping on a schedule
# to keep a free host's sleep/cold-start behavior intact and avoid needless quota use.
name: SceneSeek smoke check
on:
  workflow_dispatch:
jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured API health endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          test -n "$API_URL" || (echo "Set API_URL in repository secrets" && exit 1)
          curl --fail --show-error --silent --max-time 30 "$API_URL/healthz"
