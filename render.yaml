# Render Blueprint: New + > Blueprint > pick this repo. Everything below is on the free plan.
services:
  - type: web
    name: sceneseek-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Neon connection string (use the pooled host, ?sslmode=require)
        sync: false
      - key: GOOGLE_CLIENT_ID      # OAuth Web client ID from Google Cloud Console
        sync: false
      - key: CORS_ORIGINS          # your frontend URL, e.g. https://sceneseek-web.onrender.com
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: ENABLE_ONLINE_ANIME
        value: "true"
      - key: APP_ENV
        value: production
      - key: OMDB_API_KEY
        sync: false

  - type: web
    name: sceneseek-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL   # your API URL, e.g. https://sceneseek-api.onrender.com
        sync: false
