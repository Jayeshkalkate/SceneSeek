services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-sqlite:////data/sceneseek.db}
      UPLOAD_DIR: /data/uploads
      REFERENCE_INDEX_PATH: /data/reference/index.json
      EVALUATION_REPORT_PATH: /data/reports/evaluation.json
      WORKER_STATUS_PATH: /data/worker_status.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-10}
      READ_RATE_LIMIT_PER_MINUTE: ${READ_RATE_LIMIT_PER_MINUTE:-180}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-26214400}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-30}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-24}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-uploads}
      ENABLE_OCR: ${ENABLE_OCR:-false}
      ENABLE_ASR: ${ENABLE_ASR:-false}
      ENABLE_ONLINE_ANIME: ${ENABLE_ONLINE_ANIME:-true}
      USE_PGVECTOR: ${USE_PGVECTOR:-false}
      METADATA_ENRICHMENT_ENABLED: ${METADATA_ENRICHMENT_ENABLED:-true}
      METADATA_CACHE_HOURS: ${METADATA_CACHE_HOURS:-24}
      CLIP_MODEL: ${CLIP_MODEL:-clip-ViT-B-32}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
    volumes:
      - ./data:/data
      - ./reports:/data/reports
    ports:
      - "8000:7860"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        INSTALL_CLIP: ${INSTALL_CLIP:-false}
        INSTALL_OCR: ${INSTALL_OCR:-false}
        INSTALL_ASR: ${INSTALL_ASR:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-sqlite:////data/sceneseek.db}
      UPLOAD_DIR: /data/uploads
      REFERENCE_INDEX_PATH: /data/reference/index.json
      WORKER_STATUS_PATH: /data/worker_status.json
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-uploads}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-30}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-24}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-600}
      ENABLE_OCR: ${ENABLE_OCR:-false}
      ENABLE_ASR: ${ENABLE_ASR:-false}
      ENABLE_ONLINE_ANIME: ${ENABLE_ONLINE_ANIME:-true}
      USE_PGVECTOR: ${USE_PGVECTOR:-false}
      CLIP_MODEL: ${CLIP_MODEL:-clip-ViT-B-32}
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
